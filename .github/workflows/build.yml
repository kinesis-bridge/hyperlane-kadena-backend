name: Create a complete package for Hyperlane Backend
on:
  push:

  workflow_dispatch:
   inputs:
     create_release:
       description: "Create a GitHub release"
       required: true
       type: boolean
     release_tag:
       description: "Release tag (example: v1.0.0)"
       required: true
       type: string

jobs:
  build:

    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04

    runs-on: ${{ matrix.os }}

    env:
      KDA_TOOL_VERSION: 1.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout Hyperlane Monorepo
        uses: actions/checkout@v6
        with:
          repository: kinesis-bridge/hyperlane-monorepo-kda-community
          path: hyperlane
          ref: kadena-support-develop

      - name: Checkout keys repos
        uses: actions/checkout@v6
        with:
          repository: kinesis-bridge/kadena-hyperlane-keys
          path: keys

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Node JS
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install KDA tool
        run: |
          ARCHIVE=kda-tool-${KDA_TOOL_VERSION}-${{ matrix.os }}.tar.gz
          wget -nv https://github.com/kda-community/kda-tool/releases/download/${KDA_TOOL_VERSION}/$ARCHIVE
          tar xzf $ARCHIVE
          echo "KDA_TOOL_BIN=kda-tool-${KDA_TOOL_VERSION}/kda" >> "$GITHUB_ENV"

      - name: Build Hyperlane agents
        run: |
          cd hyperlane/rust
          cargo build --release --bin relayer
          cargo build --release --bin validator

      - name: Install Kadena proxy dependencies
        run: |
          cd hyperlane/typescript/agents/kadena-proxy
          yarn install

      - name: Prepare Webpack build
        run: |
          cd hyperlane/typescript/agents/kadena-proxy
          cat << EOF > webpack.config.js

          const path = require('path');
          module.exports = {
            entry: './src/main.ts',
            target: 'node',
            mode: 'production',
            externals: [],
            resolve: {
              extensions: ['.ts', '.js'],
            },
            output: {
              path: path.resolve(__dirname, 'dist'),
              filename: 'kadena_proxy.js',
            },
          };
          EOF

          tmp=$(mktemp) && \
          jq '.compilerOptions += {"webpack": true, "webpackConfigPath": "webpack.config.js"}' nest-cli.json > "$tmp"
          mv "$tmp" nest-cli.json

      - name: Build kadena proxy
        run: |
          cd hyperlane/typescript/agents/kadena-proxy
          yarn run nest build --webpack

      - name: Prepare Artifact
        run: |
          DIST=$GITHUB_WORKSPACE/dist
          AGENTS_DIR=$DIST/agents
          KEYS_DIR=$DIST/keys
          PROXY_DIR=$DIST/proxy
          TOOLS_DIR=$DIST/tools
          SYSTEMD_DIR=$DIST/systemd
          ETC_DIR=$DIST/etc
          CONFIG_DIR=$DIST/config

          mkdir -p $AGENTS_DIR
          cp hyperlane/rust/target/release/relayer $AGENTS_DIR
          cp hyperlane/rust/target/release/validator $AGENTS_DIR

          strip $AGENTS_DIR/validator
          strip $AGENTS_DIR/relayer

          mkdir -p $PROXY_DIR
          cp hyperlane/typescript/agents/kadena-proxy/dist/kadena_proxy.js $PROXY_DIR

          mkdir -p $KEYS_DIR
          cp keys/ethereum_operators.json $KEYS_DIR
          cp keys/kadena_relayers.yaml.gpg $KEYS_DIR
          cp keys/kadena_validators.yaml.gpg $KEYS_DIR

          mkdir -p $ETC_DIR
          mkdir -p $CONFIG_DIR

          yq -o=json '.' kda_hyperlane.yaml  > $CONFIG_DIR/kda_hyperlane.json

          BLACKLIST=$(yq -o=json blacklist.yaml | jq -c .)
          export BLACKLIST

          yq -o=json '.blacklist = strenv(BLACKLIST)' relayer.yaml > "$CONFIG_DIR/relayer.json"

          yq -o=json '.' validator.yaml > $CONFIG_DIR/validator.json

          cd etc
          for f in *template.yaml; do
            yq -o=json '.' "$f" > $ETC_DIR/"${f%.*}.json"
          done

          yq -o=json '.' rpcs.yaml > $ETC_DIR/rpcs.json

          cp validator.env $ETC_DIR
          cp aws_secret.env.template $ETC_DIR
          cd ..


          mkdir -p $TOOLS_DIR
          cp ~/.foundry/bin/cast $TOOLS_DIR
          cp $KDA_TOOL_BIN $TOOLS_DIR

          mkdir -p $SYSTEMD_DIR
          cp systemd/* $SYSTEMD_DIR


      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: hyperlane-kadena-${{ matrix.os }}-${{github.sha}}
          path: dist/

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true

    env:
      BASE_ARCH: ubuntu-22.04
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts/hyperlane-kadena-${{inputs.release_tag}}

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create artifacts dir
        run: |
          mkdir -p $ARTIFACT_DIR
          mkdir -p release

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: hyperlane-kadena-${{ env.BASE_ARCH }}-${{github.sha}}
          path: ${{ env.ARTIFACT_DIR }}


      - name: Prepare etc directory
        run: |
          mkdir -p etc/hyperlane
          cp $ARTIFACT_DIR/etc/* etc/hyperlane
          tar czf etc-kadena-hyperlane.tar.gz etc

      - name: Prepare main archive
        run: |
          mkdir -p hyperlane-kadena-${{inputs.release_tag}}
          cp -rf $ARTIFACT_DIR/*  hyperlane-kadena-${{inputs.release_tag}}
          tar czf hyperlane-kadena-${{inputs.release_tag}}.tar.gz hyperlane-kadena-${{inputs.release_tag}}

      - name: Prepare release
        working-directory: release
        run: |
          cp ../hyperlane-kadena-${{inputs.release_tag}}.tar.gz .
          cp $ARTIFACT_DIR/proxy/kadena_proxy.js .
          cp $ARTIFACT_DIR/agents/validator .
          cp $ARTIFACT_DIR/agents/relayer .
          cp ../etc-kadena-hyperlane.tar.gz .
          cp $ARTIFACT_DIR/config/* .

      - name: Compute SHA256
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS

      - name: Prepare GPG Key
        working-directory: release
        run: |
           echo "${{ secrets.GPG_PRIVATE_KEY}}" | gpg --batch --import


      - name: Sign important files
        working-directory: release
        env:
          FILES_TO_SIGN: validator relayer SHA256SUMS kda_hyperlane.json kadena_proxy.js
        run: |
          # We don't sign relayer.json, and validator.json as they are not critical file and may be be changed locally by the relayer
          for f in $FILES_TO_SIGN
            do echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback --detach-sign --armor $f
          done

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "release/*"
          body: "Kadena Systemd Package Release"
          tag: ${{inputs.release_tag}}
          draft: true